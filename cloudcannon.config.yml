paths:
  static: static
  uploads: static/images
timezone: Asia/Tehran
markdown:
  engine: commonmark
  options:
    gfm: true
    linkify: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    breaks: false
    xhtml: false
    attributes: false
    typographer: false
    treat_indentation_as_code: true
_snippets_imports:
  hugo:
    exclude:
      - hugo_instagram
collections_config:
  content:
    path: content
    icon: wysiwyg
  posts:
    path: content/posts
    icon: event_available
    glob:
      - '!_index.md'
